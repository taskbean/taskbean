<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskbean Prototype — Action Queue</title><link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;--bg:#1A120E;--s1:#241A14;--s2:#2E221A;--line:#4A3828;--text:#E8DDD0;--muted:#B7A593;--ember:#E8863C;--cream:#F6D6A8;--red:#F28779;--green:#90C99A;--blue:#91B9DD;--focus:#FFD29E}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-width:0}button,input{font:inherit}button{color:inherit}.app{min-height:100vh;padding:14px 14px 92px;max-width:720px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;height:36px}.brand{display:flex;align-items:center;gap:8px;font-weight:750;letter-spacing:-.02em}.bean{width:17px;height:22px;border-radius:60% 40% 58% 42%;background:var(--ember);transform:rotate(24deg);box-shadow:inset 4px -3px 0 #C8520A}.prototype{font-size:12px;letter-spacing:.11em;color:var(--cream);border:1px solid var(--line);padding:3px 6px;border-radius:6px}.heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:8px 0 12px}.heading h1{font-size:24px;line-height:1.04;margin:0;letter-spacing:-.025em}.heading p{margin:4px 0 0;color:var(--muted);font-size:12px}.primary,.mini,.iconbtn{border:1px solid var(--line);background:var(--s2);border-radius:8px;padding:8px 10px;cursor:pointer}.primary{background:var(--ember);color:#1A120E;border-color:var(--ember);font-weight:750;white-space:nowrap}.primary:hover{background:#D4922E}.mini:hover,.iconbtn:hover{border-color:#7A6348}.primary:focus-visible,.mini:focus-visible,.iconbtn:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.summary{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:thin}.chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:12px}.chip b{color:var(--text)}.section{margin-top:13px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px}.section-title h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:0;color:var(--muted)}.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}.row{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:7px}.row.compact{padding:8px 10px}.rowhead{display:flex;align-items:flex-start;gap:8px}.state{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 auto;background:var(--muted)}.hitl{background:var(--ember);box-shadow:0 0 0 3px #4A3828}.flight{background:var(--blue)}.blocked{background:var(--red)}.ready{background:var(--green)}.grow{min-width:0;flex:1}.title{font-weight:680;letter-spacing:-.01em}.meta,.sub{color:var(--muted);font-size:12px;margin-top:2px}.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 5px;margin:5px 3px 0 0;color:var(--cream)}.actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}.mini{font-size:12px;padding:5px 8px}.mini.em{border-color:#C8520A;color:var(--cream)}details{margin-top:7px}summary{cursor:pointer;color:var(--muted);font-size:12px}.raw{font:10px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);margin:6px 0 0;white-space:pre-wrap}.annotation{position:sticky;bottom:72px;z-index:3;background:#2b2119;border:1px solid #4A3828;border-radius:12px;padding:8px 10px;margin-top:14px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.4)}.annotation b{color:var(--cream)}.switcher{position:fixed;left:50%;bottom:14px;z-index:10;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:#1A120E;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.4)}.iconbtn{padding:6px 9px}.variants{display:flex;gap:3px}.vbtn{min-width:28px}.vbtn[aria-current=true]{background:var(--ember);color:#1A120E;border-color:var(--ember);font-weight:800}.toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--cream);color:#1A120E;padding:8px 12px;border-radius:8px;font-weight:700;z-index:20;opacity:0;pointer-events:none;transition:opacity .15s}.toast.show{opacity:1}.group{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.outcome{font-size:16px;font-weight:750}.source-line{display:grid;grid-template-columns:18px 1fr auto;gap:7px;align-items:start;padding:7px 0;border-top:1px solid #4A3828}.source-line:first-of-type{margin-top:7px}.linkline{height:10px;width:1px;background:var(--line);margin:0 auto}.pair{display:grid;grid-template-columns:1fr 18px 1fr;gap:5px;align-items:stretch;margin-bottom:8px}.pair .row{margin:0}.arrow{display:grid;place-items:center;color:var(--ember);font-weight:900}.signal{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.table-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:var(--muted);font-weight:600;background:var(--s2);position:sticky;top:0}.table th,.table td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}.table tr:last-child td{border-bottom:0}.table .cmd{white-space:nowrap}.statusword{font-weight:700}.taxonomy{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.taxonomy .tag{margin:0}.search{width:100%;border:1px solid var(--line);background:var(--s1);color:var(--text);border-radius:8px;padding:7px 9px;margin-bottom:8px}::selection{background:var(--ember);color:#1A120E}html[data-variant=D] .search{display:none}@media(max-width:380px){.app{padding:8px 10px 88px}.heading{margin:4px 0 7px}.summary{margin-bottom:5px}.section{margin-top:7px}.heading h1{font-size:24px}.pair{grid-template-columns:1fr}.arrow{transform:rotate(90deg);height:14px}.table th:nth-child(3),.table td:nth-child(3){display:none}.annotation{bottom:68px}}@media(min-width:540px){.app{padding-inline:20px}.queue-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.pair{grid-template-columns:1fr 24px 1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="toast" role="status" aria-live="polite"></div><main class="app" id="app"></main><nav class="switcher" aria-label="Prototype variants"><button class="iconbtn" id="prev" aria-label="Previous variant">←</button><div class="variants" id="variants"></div><button class="iconbtn" id="next" aria-label="Next variant">→</button></nav>
<script>
const records={
 hitl:{title:'Example Service pilot charter — the reviewer decision',meta:'example-service · 12m ago',type:'HITL gate',raw:'2026-09-11T19:28:00-07:00 · completed evidence pack · outcome/commitment'},
 flight:{title:'Example Product first PM pilot',meta:'Product: Example Product · urgent · owner/date missing',type:'Execution session',raw:'2026-09-11T19:22:00-07:00 · Priority source · execution session active'},
 blocked:{title:'Example App migration — app re-registration',meta:'example-app · waiting 36m',type:'Work item',raw:'2026-09-11T19:09:00-07:00 · blocked: awaiting app re-registration'},
 ready:{title:'Review PR #12 before PR #13',meta:'example-repo · Product: Example Skills · dependent sequence',type:'Commitment',raw:'2026-09-11T18:42:00-07:00 · PR #13 depends on PR #12'},
 waiting:{title:'Example Docs meeting request',meta:'Planner / To Do · awaiting the reviewer response',type:'Outcome',raw:'2026-09-11T17:31:00-07:00 · commitment source: Planner / To Do'}
};
let current=(new URLSearchParams(location.search).get('variant')||'A').toUpperCase(); if(!'ABCD'.includes(current))current='A';
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const tags=()=>'<div class="taxonomy" aria-label="Taxonomy lens"><span class="tag">Commitment</span><span class="tag">Outcome</span><span class="tag">Work item</span><span class="tag">Source</span><span class="tag">Repository / Product</span><span class="tag">Execution session</span><span class="tag">HITL gate</span></div>';
const rec=(r,state,actions='')=>`<article class="row compact" data-work-item><div class="rowhead"><span class="state ${state}" aria-hidden="true"></span><div class="grow"><div class="title">${esc(r.title)}</div><div class="meta">${esc(r.meta)} · ${r.type}</div>${actions?`<div class="actions">${actions}</div>`:''}<details><summary>Provenance & raw time</summary><p class="raw">${esc(r.raw)}</p></details></div></div></article>`;
const action=(label,kind='')=>`<button class="mini ${kind}" data-mock="${label}">${label}</button>`;
function shell(name,sub,body,model){document.title=`Taskbean Prototype — ${name}`;return `<header><div class="top"><div class="brand"><span class="bean" aria-hidden="true"></span>taskbean</div><span class="prototype">THROWAWAY PROTOTYPE</span></div><div class="heading"><div><h1>${name}</h1><p>${sub}</p></div><button class="primary" data-mock="New commitment">New commitment</button></div></header>${body}<aside class="annotation" aria-label="Model annotation"><b>Model:</b> ${model} <b>Known risk:</b> inferred links can overstate intent. <b>Assumption:</b> local task ledger remains canonical.</aside>`}
function A(){return shell('Action Queue','Five states, ordered for intervention.',`<div class="summary"><span class="chip"><b>1</b> needs you</span><span class="chip"><b>1</b> in flight</span><span class="chip"><b>1</b> blocked</span><span class="chip"><b>1</b> ready next</span></div><div class="queue-grid"><section class="section"><div class="section-title"><h2>Needs you</h2><span class="count">01</span></div>${rec(records.hitl,'hitl',action('Review gate','em')+action('Dismiss'))}</section><section class="section"><div class="section-title"><h2>In flight</h2><span class="count">01</span></div>${rec(records.flight,'flight',action('Open session'))}</section><section class="section"><div class="section-title"><h2>Ready next</h2><span class="count">01</span></div>${rec(records.ready,'ready',action('Start next','em'))}</section><section class="section"><div class="section-title"><h2>Waiting</h2><span class="count">02</span></div>${rec(records.blocked,'blocked',action('Add unblock note'))}${rec(records.waiting,'', '')}</section></div>${tags()}`,'Priority is intervention cost, not task age.');}
function B(){return shell('Outcome Stack','Commitments grouped by the result they serve.',`<div class="summary"><span class="chip"><b>HITL</b></span><span class="chip"><b>In flight</b></span><span class="chip"><b>Blocked</b></span><span class="chip"><b>Ready next</b></span></div><section class="row" data-work-item><div class="outcome">Launch Example Service pilot</div><div class="meta">Outcome · repository example-service · 12m ago</div><div class="group"><b>Commitment: approve pilot charter and evidence pack</b><div class="source-line"><span class="state hitl"></span><div><b>the reviewer decision required</b><div class="sub">HITL gate · proposed from Copilot session</div></div>${action('Review','em')}</div><div class="source-line"><span class="state flight"></span><div><b>Completed evidence pack</b><div class="sub">Work item · execution session example-session</div></div>${action('Inspect')}</div></div></section><section class="row" data-work-item><div class="outcome">Run Example Product first PM pilot</div><div class="meta">Strategic priority · Product: Example Product · urgent</div><div class="group"><b>Commitment: assign owner and date</b><div class="source-line"><span class="state blocked"></span><div><b>Owner and date are missing</b><div class="sub">Source: deployment response · raw in disclosure</div></div>${action('Plan')}</div><div class="source-line"><span class="state ready"></span><div><b>Name owner and schedule pilot</b><div class="sub">Ready next · no session assigned</div></div>${action('Start','em')}</div></div></section>${tags()}`,'Outcomes are curated; sources and sessions are nested evidence.');}
function C(){return shell('Signal + Response','Provenance inbox paired with resulting work.',`<div class="summary"><span class="chip"><b>HITL</b></span><span class="chip"><b>In flight</b></span><span class="chip"><b>Blocked</b></span><span class="chip"><b>Ready next</b></span></div><section class="pair" data-work-item><article class="row"><div class="signal">Source signal · 4m ago</div><div class="title">Chronicle: high token use on Example pilot</div><div class="meta">Chronicle signal · linked outcome, not task truth</div><details><summary>Raw evidence</summary><p class="raw">chronicle insight · 2026-09-11T19:28:00-07:00 · token spike</p></details></article><div class="arrow" aria-hidden="true">→</div><article class="row"><div class="signal">HITL response</div><div class="title">Decide whether efficiency insight changes the outcome</div><div class="meta">HITL gate · Example Service outcome</div><div class="actions">${action('Compare','em')}${action('Reject')}</div></article></section><section class="pair" data-work-item><article class="row"><div class="signal">Planner / To Do signal · 2h ago</div><div class="title">Example Docs meeting request</div><div class="meta">Source: Planner / To Do · awaiting the reviewer</div></article><div class="arrow" aria-hidden="true">→</div><article class="row"><div class="signal">Response commitment</div><div class="title">Example App migration — app re-registration</div><div class="meta">Waiting · Product: Example Docs · owner the reviewer</div><div class="actions">${action('Add evidence')}</div></article></section><section class="pair" data-work-item><article class="row"><div class="signal">Taskbean dependency · 1h ago</div><div class="title">Review PR #12 before PR #13</div><div class="meta">Repository: example-repo · Product: Example Skills</div></article><div class="arrow" aria-hidden="true">→</div><article class="row"><div class="signal">Ready next</div><div class="title">Review PR #12 before PR #13</div><div class="meta">Ready next · dependent sequence</div><div class="actions">${action('Start','em')}</div></article></section>${tags()}`,'Signals never become work without a visible response boundary.');}
function D(){return shell('Command Table','Dense operational view across local truth.',`<input class="search" aria-label="Filter commands" placeholder="Filter work, repository, session…"><div class="summary"><span class="chip"><b>7</b> rows</span><span class="chip"><b>6</b> scopes</span><span class="chip"><b>1</b> HITL gate</span></div><div class="table-wrap" data-work-item><table class="table"><thead><tr><th>State / work</th><th>Scope</th><th>Source</th><th>Command</th></tr></thead><tbody><tr><td><span class="statusword" style="color:var(--cream)">HITL</span><br>Decide whether efficiency insight changes the outcome<br><span class="sub">4m ago</span></td><td>taskbean</td><td>session example-a</td><td class="cmd">${action('Review','em')}</td></tr><tr><td><span class="statusword" style="color:var(--blue)">IN FLIGHT</span><br>Example Product PM pilot<br><span class="sub">18m ago</span></td><td>Example Product</td><td>session example-b</td><td>${action('Inspect')}</td></tr><tr><td><span class="statusword" style="color:var(--red)">BLOCKED</span><br>Example App app re-registration<br><span class="sub">36m ago</span></td><td>example-app</td><td>Taskbean</td><td>${action('Note')}</td></tr><tr><td><span class="statusword" style="color:var(--green)">READY NEXT</span><br>Review PR #12 → #13<br><span class="sub">1h ago</span></td><td>example-repo</td><td>PR #13 depends on PR #12</td><td>${action('Start','em')}</td></tr><tr><td><span class="statusword">WAITING</span><br>Example Docs request<br><span class="sub">2h ago</span></td><td>taskbean</td><td>commitment source: Planner / To Do</td><td>${action('Open')}</td></tr><tr data-work-item><td><span class="statusword">UNKNOWN REPO</span><br>Raw worktree session<br><span class="sub">28m ago</span></td><td>unknown</td><td>Copilot session</td><td><details><summary>Raw</summary><span class="raw">example-worktree · session example-session</span></details></td></tr><tr data-work-item><td><span class="statusword">INSIGHT</span><br>Token use vs pilot outcome<br><span class="sub">12m ago</span></td><td>example-service</td><td>Chronicle</td><td>${action("Open evidence")}</td></tr></tbody></table></div><details><summary>Diagnostics (hidden by default)</summary><p class="raw">adapter=static-prototype · persistence=none · backend=none · canonical=taskbean-local-ledger</p></details>${tags()}`,'Rows optimize command selection; taxonomy is flattened into columns.');}
function render(){document.documentElement.dataset.variant=current;history.replaceState(null,'',`?variant=${current}`);document.querySelector('#app').innerHTML=({A,B,C,D}[current])();document.querySelectorAll('.vbtn').forEach(b=>b.setAttribute('aria-current',String(b.dataset.v===current)));document.querySelectorAll('[data-mock]').forEach(b=>b.onclick=()=>{b.disabled=true;const t=document.querySelector('.toast');t.textContent=`Mocked in memory: ${b.dataset.mock}`;t.classList.add('show');setTimeout(()=>{t.classList.remove('show');b.disabled=false},900)});}
for(const v of 'ABCD'){const b=document.createElement('button');b.className='iconbtn vbtn';b.dataset.v=v;b.textContent=v;b.setAttribute('aria-label',`Show variant ${v}`);b.onclick=()=>{current=v;render()};document.querySelector('#variants').append(b)}
function move(n){current='ABCD'[('ABCD'.indexOf(current)+n+4)%4];render();scrollTo(0,0)}document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});render();
</script></body></html>
