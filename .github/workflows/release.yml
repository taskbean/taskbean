name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag to publish to npm (e.g. v0.7.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            artifact: bean-linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact: bean-linux-arm64
          - os: macos-latest
            target: darwin-x64
            artifact: bean-darwin-x64
          - os: macos-latest
            target: darwin-arm64
            artifact: bean-darwin-arm64
          - os: windows-latest
            target: windows-x64
            artifact: bean-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: cli
        run: bun install

      - name: Compute version
        id: version
        shell: bash
        run: |
          # Tags are `vX.Y.Z`; the runtime VERSION constant is `X.Y.Z`.
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compile binary
        working-directory: cli
        shell: bash
        run: |
          mkdir -p ../dist
          bun build bin/taskbean.js \
            --compile \
            --target=bun-${{ matrix.target }} \
            --define 'globalThis.TASKBEAN_VERSION="${{ steps.version.outputs.value }}"' \
            --outfile=../dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ github.ref_name }}
      windows_sha256: ${{ steps.sha256sums.outputs.windows_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute SHA256SUMS
        id: sha256sums
        shell: bash
        run: |
          cd dist
          # Canonical sha256sum-compatible format: "<hash>  <filename>".
          sha256sum bean-* > SHA256SUMS
          cat SHA256SUMS
          # Export the Windows hash for the winget step downstream.
          win_hash=$(awk '/bean-windows-x64.exe$/{print $1}' SHA256SUMS)
          echo "windows_sha256=${win_hash}" >> "$GITHUB_OUTPUT"

      - name: Compute version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' ||
           (needs.release.result == 'success' && !contains(github.ref_name, '-'))) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and check out release tag
        id: version
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected an existing stable release tag in vX.Y.Z format."
            exit 1
          fi
          if ! commit=$(git rev-parse --verify "refs/tags/${TAG}^{commit}"); then
            echo "::error::Release tag ${TAG} does not exist or does not point to a commit."
            exit 1
          fi
          git checkout --detach "$commit"
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Require published GitHub release for dispatched tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease); then
            echo "::error::No published GitHub release exists for ${TAG}; npm publication requires one."
            exit 1
          fi
          if [[ "$(jq -r '.isDraft' <<<"$release")" != "false" ]]; then
            echo "::error::GitHub release ${TAG} is a draft; publish the release before npm publication."
            exit 1
          fi
          if [[ "$(jq -r '.isPrerelease' <<<"$release")" != "false" ]]; then
            echo "::error::GitHub release ${TAG} is a prerelease; only stable releases publish to npm."
            exit 1
          fi
          echo "GitHub release ${TAG} is published and stable."

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify publishing toolchain
        shell: bash
        run: |
          node --version
          npm --version
          NPM_VERSION=$(npm --version) node <<'NODE'
          const version = process.env.NPM_VERSION;
          const [major, minor, patch] = version.split('.').map(Number);
          if (!/^\d+\.\d+\.\d+$/.test(version) ||
              !(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) {
            throw new Error(`npm >= 11.5.1 is required for trusted publishing; found ${version}`);
          }
          NODE

      - name: Check whether npm version is already published
        id: published
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const version = process.env.VERSION;
          const response = await fetch(`https://registry.npmjs.org/taskbean/${version}`);
          if (response.status === 404) {
            console.log(`taskbean@${version} is not published; continuing with OIDC.`);
            appendFileSync(process.env.GITHUB_OUTPUT, 'exists=false\n');
          } else {
            if (!response.ok) {
              throw new Error(`npm registry lookup failed: HTTP ${response.status}`);
            }
            const metadata = await response.json();
            if (metadata.name !== 'taskbean' || metadata.version !== version) {
              throw new Error('npm registry returned unexpected package metadata');
            }
            console.log(`taskbean@${version} is already published; skipping npm publish.`);
            appendFileSync(process.env.GITHUB_OUTPUT, 'exists=true\n');
          }
          NODE

      - name: Set version from tag
        if: steps.published.outputs.exists == 'false'
        working-directory: cli
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts

      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        working-directory: cli
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::notice::Publishing without provenance: a dispatch run's attestation would name the dispatching commit, not the release tag commit."
            npm publish --access public --provenance=false
          else
            npm publish --access public
          fi

  winget:
    # Submits a PR to microsoft/winget-pkgs. Gated on the repo secret
    # WINGET_TOKEN being set — create a classic PAT with `public_repo` scope
    # and add it as a repo secret named WINGET_TOKEN. Without it this job
    # skips gracefully so normal releases aren't blocked.
    needs: release
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    steps:
      - name: Check for WINGET_TOKEN
        id: gate
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "${WINGET_TOKEN:-}" ]; then
            echo "WINGET_TOKEN secret not set — skipping winget submission."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'

      - name: Render winget manifests
        if: steps.gate.outputs.skip == 'false'
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
          WIN_SHA: ${{ needs.release.outputs.windows_sha256 }}
        run: |
          # Substitute <VERSION> / <SHA256> placeholders in the committed
          # manifest templates under cli/distribution/winget/. The rendered
          # files are uploaded as a workflow artifact for auditing and act as
          # the reference manifests; winget-releaser (below) regenerates its
          # own manifests from the release assets.
          cd cli/distribution/winget
          for f in *.yaml; do
            sed -i "s|<VERSION>|${VERSION}|g; s|<SHA256>|${WIN_SHA}|g" "$f"
            echo "── $f ──"
            cat "$f"
          done

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          name: winget-manifests
          path: cli/distribution/winget/*.yaml

      - name: Submit to winget-pkgs
        if: steps.gate.outputs.skip == 'false'
        uses: vedantmgoyal2009/winget-releaser@main
        with:
          identifier: taskbean.taskbean
          version: ${{ needs.release.outputs.version }}
          installers-regex: '^bean-windows-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
